name: Publish bypass lists

# Devices take newer bypass lists without an app update (client/…/lists/ListUpdates.kt, docs/RELEASE.md).
# Whenever the lists change on main (the weekly refresh PR is merged), they are bundled, signed by the
# release key and attached to the fixed pre-release "bypass-lists"; apps read
# releases/download/bypass-lists/lists.json once a day.
on:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/bypass/**"
      - ".github/workflows/lists.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bypass-lists
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Open the release key
        env:
          PN_KEYS_PASSWORD: ${{ secrets.PN_KEYS_PASSWORD }}
        run: |
          if [ -z "$PN_KEYS_PASSWORD" ]; then echo "::error::Secret PN_KEYS_PASSWORD is not set (docs/RELEASE.md)"; exit 1; fi
          k="$RUNNER_TEMP/keys"; mkdir -p "$k"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in keys/release-keys.enc -pass env:PN_KEYS_PASSWORD | tar x -C "$k"
          seed=$(sed -n 's/^PN_RELEASE_SEED=//p' "$k/release.env")
          echo "::add-mask::$seed"
          echo "PN_RELEASE_SEED=$seed" >> "$GITHUB_ENV"
          rm -rf "$k"
      - name: Bundle and sign
        run: |
          ./gradlew -Pparamnezia.jvmOnly=true :releasetool:installDist --no-configuration-cache
          tool=releasetool/build/install/releasetool/bin/releasetool
          # Devices would refuse lists signed by any other key.
          $tool pubkey > pinned-check.txt
          grep -E '^paramnezia\.releaseKey=' gradle.properties | diff - pinned-check.txt \
            || { echo "::error::PN_RELEASE_SEED does not match gradle.properties (docs/RELEASE.md)"; exit 1; }
          $tool sign-lists --dir app/src/main/assets/bypass \
            --url-base "https://github.com/${{ github.repository }}/releases/download/bypass-lists" --out-dir out
      - name: Attach to the bypass-lists pre-release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # A pre-release never becomes "latest", so releases/latest stays the newest app.
          gh release view bypass-lists >/dev/null 2>&1 || gh release create bypass-lists --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Списки обхода" \
            --notes "Подписанные списки «российское напрямую» и блокировки трекеров. Приложения забирают их сами раз в сутки; ставить ничего не нужно."
          # The bundle first, lists.json last: lists.json never points at a file that is not there yet.
          gh release upload bypass-lists out/lists-*.txt --clobber
          gh release upload bypass-lists out/lists.json --clobber
