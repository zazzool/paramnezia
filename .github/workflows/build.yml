name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: Core, deploy and release tool (JVM tests + Docker e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (the deploy e2e installs a real AmneziaWG server in Docker and handshakes with it)
        env: { PN_E2E: "1" }
        run: ./gradlew -Pparamnezia.jvmOnly=true test :releasetool:installDist --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jvm-test-reports, path: "**/build/reports/tests/", if-no-files-found: ignore }

  go:
    name: Native tunnel (Go tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-go@v5
        with: { go-version-file: tunnel/src/main/go/go.mod, cache-dependency-path: tunnel/src/main/go/go.sum }
      - working-directory: tunnel/src/main/go
        run: |
          export CGO_CFLAGS="-I$JAVA_HOME/include -I$JAVA_HOME/include/linux"
          go vet ./...
          go test -race -count=1 ./...

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # the apk-builds branch below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-go@v5
        with: { go-version-file: tunnel/src/main/go/go.mod, cache-dependency-path: tunnel/src/main/go/go.sum }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        env:
          PN_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Audit the release APK (Play Protect rules, docs/PLAY-PROTECT.md)
        run: bash .github/scripts/apk-audit.sh app/build/outputs/apk/release/app-release.apk
      - name: Keep the newest APKs on the apk-builds branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir /tmp/apk-builds && cd /tmp/apk-builds
          # Signed with the runner's debug key: for testing only, it does not install over a release.
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/release/app-release.apk paramnezia-ci-release-debugkey.apk
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/app-debug.apk paramnezia-ci-debug.apk
          git init -q -b apk-builds
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "APKs from ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-builds
      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: paramnezia-apk
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-report, path: app/build/reports/lint-results-*.html, if-no-files-found: ignore }

  smoke:
    name: Connects on an emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: paramnezia-apk, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: WireGuard server on the host (10.0.2.2 from the emulator)
        run: |
          sudo apt-get install -y -qq wireguard-tools >/dev/null
          # Throwaway keys for this run only.
          wg genkey > s.key; wg pubkey < s.key > s.pub; wg genkey > c.key; wg pubkey < c.key > c.pub
          sudo ip link add wg0 type wireguard
          sudo install -D -m 600 s.key /etc/wireguard/wg0.key  # wg may only read keys under /etc/wireguard (AppArmor)
          sudo wg set wg0 listen-port 51820 private-key /etc/wireguard/wg0.key peer "$(cat c.pub)" allowed-ips 10.9.0.2/32
          sudo ip addr add 10.9.0.1/24 dev wg0
          sudo ip link set wg0 up
          # The emulator reaches the internet through the tunnel (the home screen checks its address).
          sudo sysctl -qw net.ipv4.ip_forward=1
          sudo iptables -t nat -A POSTROUTING -s 10.9.0.0/24 ! -o wg0 -j MASQUERADE
          sudo iptables -I FORWARD -i wg0 -j ACCEPT
          sudo iptables -I FORWARD -o wg0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          printf '[Interface]\nPrivateKey = %s\nAddress = 10.9.0.2/32\nDNS = 1.1.1.1\n\n[Peer]\nPublicKey = %s\nEndpoint = 10.0.2.2:51820\nAllowedIPs = 0.0.0.0/0\nPersistentKeepalive = 25\n' "$(cat c.key)" "$(cat s.pub)" > client.conf
      - name: Install the release APK, import the server, connect
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/vpn-e2e.sh "$(find apk -name '*release*.apk' | head -1)" client.conf ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "smoke-${{ matrix.api }}", path: "logcat-*.txt\nscreen-*.png\nui-*.xml", if-no-files-found: ignore }
