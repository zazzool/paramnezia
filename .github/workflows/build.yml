name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: Core, deploy and release tool (JVM tests + Docker e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (the deploy e2e installs a real AmneziaWG server in Docker and handshakes with it)
        env: { PN_E2E: "1" }
        run: ./gradlew -Pparamnezia.jvmOnly=true test :releasetool:installDist --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jvm-test-reports, path: "**/build/reports/tests/", if-no-files-found: ignore }

  go:
    name: Native tunnel (Go tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-go@v5
        with: { go-version-file: tunnel/src/main/go/go.mod, cache-dependency-path: tunnel/src/main/go/go.sum }
      - working-directory: tunnel/src/main/go
        run: |
          export CGO_CFLAGS="-I$JAVA_HOME/include -I$JAVA_HOME/include/linux"
          go vet ./...
          go test -race -count=1 ./...

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # the apk-builds branch below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-go@v5
        with: { go-version-file: tunnel/src/main/go/go.mod, cache-dependency-path: tunnel/src/main/go/go.sum }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        env:
          PN_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Invite slot keeps the APK signature valid
        run: |
          ./gradlew -q :releasetool:installDist
          apk=app/build/outputs/apk/release/app-release.apk
          releasetool/build/install/releasetool/bin/releasetool embed --apk "$apk" --out /tmp/invite.apk --payload "vpn://ci-check"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --verbose /tmp/invite.apk
      - name: Keep the newest APKs on the apk-builds branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir /tmp/apk-builds && cd /tmp/apk-builds
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/release/app-release.apk paramnezia-release.apk
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/app-debug.apk paramnezia-debug.apk
          git init -q -b apk-builds
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "APKs from ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-builds
      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: paramnezia-apk
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-report, path: app/build/reports/lint-results-*.html, if-no-files-found: ignore }

  smoke:
    name: Starts on an emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: paramnezia-apk, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and launch the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r "$(find apk -name '*release*.apk' | head -1)"
            adb logcat -c
            adb shell am start -W -n io.paramnezia/.ui.MainActivity
            sleep 15
            adb logcat -d > logcat-${{ matrix.api }}.txt
            adb shell pidof io.paramnezia || { echo "::error::app is not running"; grep -A40 -E "FATAL EXCEPTION|AndroidRuntime" logcat-${{ matrix.api }}.txt | head -120; exit 1; }
            if grep -q "FATAL EXCEPTION" logcat-${{ matrix.api }}.txt; then grep -A40 "FATAL EXCEPTION" logcat-${{ matrix.api }}.txt | head -120; exit 1; fi
            adb exec-out screencap -p > screen-${{ matrix.api }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "smoke-${{ matrix.api }}", path: "logcat-*.txt\nscreen-*.png", if-no-files-found: ignore }

