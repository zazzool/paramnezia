name: Release

# Push a tag like v1.2.0, or a branch like release/v1.2.0, to publish (docs/RELEASE.md).
# Keys: keys/release-keys.enc (APK keystore + release seed), opened with the secret PN_KEYS_PASSWORD.
# The public half of the release key is in gradle.properties. The APK and the signed release.json are
# attached to the GitHub release; the app checks releases/latest/download/release.json.
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-go@v5
        with: { go-version-file: tunnel/src/main/go/go.mod, cache-dependency-path: tunnel/src/main/go/go.sum }
      - uses: gradle/actions/setup-gradle@v4
      - name: Open the keys
        env:
          PN_KEYS_PASSWORD: ${{ secrets.PN_KEYS_PASSWORD }}
        run: |
          if [ -z "$PN_KEYS_PASSWORD" ]; then echo "::error::Secret PN_KEYS_PASSWORD is not set (docs/RELEASE.md)"; exit 1; fi
          k="$RUNNER_TEMP/keys"; mkdir -p "$k"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in keys/release-keys.enc -pass env:PN_KEYS_PASSWORD | tar x -C "$k"
          while IFS='=' read -r name value; do
            [ -n "$name" ] || continue
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done < "$k/release.env"
          echo "PN_KEYSTORE=$k/paramnezia.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          PN_VERSION_CODE: ${{ github.run_number }}
          PN_VERSION_NAME: ${{ env.VERSION }}
        run: |
          ./gradlew :app:assembleRelease :releasetool:installDist
          # Published byte for byte as apksigner wrote it: the same file for every user and channel.
          cp app/build/outputs/apk/release/app-release.apk "paramnezia-${VERSION}.apk"
      - name: Check that the release key matches the key pinned in the app
        run: |
          # A mismatch would ship builds that silently reject every later OTA update.
          releasetool/build/install/releasetool/bin/releasetool pubkey > pinned-check.txt
          grep -E '^paramnezia\.releaseKey=' gradle.properties | diff - pinned-check.txt \
            || { echo "::error::PN_RELEASE_SEED in keys/release-keys.enc does not match gradle.properties (docs/RELEASE.md)"; exit 1; }
      - name: Audit the APK (Play Protect rules, docs/PLAY-PROTECT.md)
        run: bash .github/scripts/apk-audit.sh "paramnezia-${VERSION}.apk" --release
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          notes=""
          [ -f "docs/releases/${VERSION}.md" ] && notes="--notes-file docs/releases/${VERSION}.md"
          # Re-running a failed release: the release may already exist.
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --target "$GITHUB_SHA" --title "Paramnezia $VERSION" ${notes:---generate-notes}
          gh release upload "$VERSION" "paramnezia-${VERSION}.apk" --clobber
          # The same bytes under a fixed name: releases/latest/download/paramnezia.apk is always the
          # newest APK (the family page on the servers links it).
          cp "paramnezia-${VERSION}.apk" paramnezia.apk
          gh release upload "$VERSION" paramnezia.apk --clobber
      - name: Sign release.json
        run: |
          apk="paramnezia-${VERSION}.apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          signer=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          releasetool/build/install/releasetool/bin/releasetool sign \
            --apk "$apk" \
            --version-code "${{ github.run_number }}" \
            --version-name "$VERSION" \
            --signer-sha256 "$signer" \
            --url "${PUBLIC_BASE}/$apk" \
            --out release.json
        env: { PUBLIC_BASE: "https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}" }
        shell: bash
      - name: Attach release.json to the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$VERSION" release.json --clobber

  # Paramnezia for Windows (docs/WINDOWS.md): the installer next to the APK, and its own signed
  # release-windows.json (package net.paramnezia.windows) that the Windows app checks.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25: the Windows app (java.lang.foreign, desktop/build.gradle.kts); 21 stays the default.
          java-version: |
            25
            21
      - uses: actions/setup-go@v5
        with: { go-version-file: tunnel/src/main/go/go.mod, cache-dependency-path: tunnel/src/main/go/go.sum }
      - uses: gradle/actions/setup-gradle@v4
      - name: Service, app image and installer
        env:
          PN_VERSION_CODE: ${{ github.run_number }}
          PN_VERSION_NAME: ${{ env.VERSION }}
        run: .github/scripts/windows-build.ps1
        shell: pwsh
      - name: Installs, connects the adapter, uninstalls
        run: .github/scripts/windows-service-check.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: paramnezia-windows, path: desktop/build/installer/*.exe }

  windows-publish:
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: { name: paramnezia-windows, path: win }
      - name: Open the release key
        env:
          PN_KEYS_PASSWORD: ${{ secrets.PN_KEYS_PASSWORD }}
        run: |
          k="$RUNNER_TEMP/keys"; mkdir -p "$k"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in keys/release-keys.enc -pass env:PN_KEYS_PASSWORD | tar x -C "$k"
          while IFS='=' read -r name value; do
            [ -n "$name" ] || continue
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done < "$k/release.env"
      - name: Upload the installer and sign release-windows.json
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_BASE: "https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}"
        run: |
          ./gradlew -Pparamnezia.jvmOnly=true --no-configuration-cache :releasetool:installDist
          exe="Paramnezia-Setup-${VERSION#v}.exe"
          cp "win/$exe" "$exe"
          gh release upload "$VERSION" "$exe" --clobber
          # Fixed name for releases/latest/download/Paramnezia-Setup.exe (the family page links it).
          cp "$exe" Paramnezia-Setup.exe
          gh release upload "$VERSION" Paramnezia-Setup.exe --clobber
          releasetool/build/install/releasetool/bin/releasetool sign \
            --apk "$exe" \
            --package net.paramnezia.windows \
            --min-sdk 0 \
            --version-code "${{ github.run_number }}" \
            --version-name "$VERSION" \
            --url "${PUBLIC_BASE}/$exe" \
            --out release-windows.json
          gh release upload "$VERSION" release-windows.json --clobber
